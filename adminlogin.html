<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Red Lotus Bungalow</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- CSS Variables --- */
        :root {
            --brand-red: #D32F2F;
            --brand-red-hover: #B71C1C;
            --input-bg: #f8f9fa;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Prevents scroll on the background */
            position: relative;
        }

        /* --- Background Image & Overlay --- */
        /* A beautiful, serene resort/nature image */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1571896349842-e0ba39620a98?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover;
            z-index: -2;
        }

        /* Dark overlay to ensure the white card pops out */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Darkens the image */
            z-index: -1;
            backdrop-filter: blur(3px); /* Slight blur on background */
        }

        /* --- Login Card --- */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.8s ease-out;
            position: relative;
            z-index: 10;
        }

        /* Branding Section inside Card */
        .brand-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-icon-circle {
            width: 60px;
            height: 60px;
            background-color: var(--brand-red);
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
        }

        .brand-logo h3 {
            font-weight: 700;
            color: #333;
            margin: 0;
            font-size: 1.5rem;
        }

        .brand-logo p {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }

        /* --- Form Styling --- */
        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 5px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group-text {
            background-color: var(--input-bg);
            border: 1px solid #e0e0e0;
            border-right: none;
            color: #888;
            border-radius: 10px 0 0 10px;
        }

        .form-control {
            background-color: var(--input-bg);
            border: 1px solid #e0e0e0;
            border-left: none;
            border-radius: 0 10px 10px 0;
            padding: 12px 15px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: var(--brand-red);
            background-color: #fff;
        }

        /* Button Styling */
        .btn-login {
            background-color: var(--brand-red);
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: var(--brand-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.3);
            color: white;
        }

        /* Footer on the card (optional copyright) */
        .card-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
                margin: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Main Login Card -->
    <div class="login-card">
        
        <!-- Branding -->
        <div class="brand-logo">
            <div class="brand-icon-circle">
                <i class="bi bi-flower1"></i>
            </div>
            <h3>Red Lotus</h3>
            <p>Admin Portal</p>
        </div>

        <!-- Login Form -->
        <form method="POST" action="login.php"> <!-- Added action attribute for backend logic -->
            
            <!-- Username Input -->
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text" name="username" class="form-control" id="username" placeholder="Enter username" required>
                </div>
            </div>

            <!-- Password Input -->
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" name="password" class="form-control" id="password" placeholder="Enter password" required>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-login">
                Login to Dashboard
            </button>
            
        </form>

        <!-- Card Footer -->
        <div class="card-footer">
            &copy; 2026 Red Lotus Bungalow
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
